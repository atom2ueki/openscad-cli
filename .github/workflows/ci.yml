name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: the CLI itself, with no engine required. A fake engine
  # stands in for OpenSCAD so the whole suite runs in seconds.
  cli:
    name: cli (no engine)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run compliance

  # The real thing: build the headless engine, then run the integration suite
  # against it. This is the job that proves the engine contract.
  engine:
    name: engine (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: x64
            profile: full
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            profile: full
          - runner: macos-14
            os: darwin
            arch: arm64
            profile: full
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Fail loudly if the engine submodule moved without a deliberate bump.
      - name: verify engine pin
        run: |
          EXPECTED=$(git ls-files -s engine | awk '{print $2}')
          ACTUAL=$(git -C engine rev-parse HEAD)
          echo "pinned:   $EXPECTED"
          echo "checked:  $ACTUAL"
          test "$EXPECTED" = "$ACTUAL" || {
            echo "::error::engine submodule moved; bump it deliberately in a reviewed commit"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # libcairo2-dev is not optional here. The engine's FindCairo.cmake reads
      # cairo-version.h to satisfy a `find_package(Cairo 1.14)`, and the runner
      # image ships the cairo runtime without the headers. Without it the
      # version resolves to the empty string and the configure step dies with
      # "Required version (1.14) is higher than found version ()" — a message
      # that reads like a version problem and is really a missing package.
      #
      # gettext is not optional either: the engine's `openscad` target runs
      # msgfmt over the .po catalogues, so without it the build dies at the
      # final link step with "msgfmt: command not found" and error 127.
      - name: install engine build dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libboost-regex-dev libboost-program-options-dev \
            libeigen3-dev libcgal-dev libgmp-dev libmpfr-dev \
            libcairo2-dev \
            libglib2.0-dev libfreetype-dev libzip-dev libxml2-dev \
            libfontconfig-dev libharfbuzz-dev libdouble-conversion-dev \
            libtbb-dev flex bison lib3mf-dev gettext

      # `cairo` for the same reason as libcairo2-dev above: it is what keeps
      # PDF export compiled in (ENABLE_CAIRO gates export_pdf.cc).
      #
      # `lib3mf` was removed from homebrew-core, so it can no longer be
      # installed from a formula. The engine's `full` profile only links it
      # "when available" (see packaging/build-engine.sh), and 3MF is not
      # required by any test, so macOS builds without it. A macOS engine
      # therefore has no working 3MF import/export -- see build-engine.sh.
      #
      # No `brew update`, and the step is bounded. `brew install` runs an
      # implicit auto-update against Homebrew's metadata endpoints unless
      # HOMEBREW_NO_AUTO_UPDATE is set, and that network fetch has hung twice
      # on this repository -- once on main and once on PR #1. A hang there
      # burns the job's entire 120-minute budget and is reported as
      # "cancelled", which says nothing about the cause and never reaches a
      # compile step. Runner images ship a current enough Homebrew and
      # `brew install` fetches bottles directly, so the update buys nothing
      # worth a two-hour failure mode. HOMEBREW_NO_INSTALL_CLEANUP avoids the
      # same class of unbounded work in the cleanup pass.
      - name: install engine build dependencies (macos)
        if: runner.os == 'macOS'
        timeout-minutes: 20
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew install cmake ninja pkg-config boost eigen cgal glib freetype \
            cairo libzip libxml2 fontconfig harfbuzz double-conversion tbb \
            catch2 ccache

      - name: cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('engine/CMakeLists.txt') }}
          restore-keys: ccache-${{ matrix.os }}-${{ matrix.arch }}-

      - name: build headless engine
        run: JOBS=4 packaging/build-engine.sh ${{ matrix.profile }}

      - name: locate the built engine
        id: engine
        run: |
          # -iname, not -name: the engine is named "OpenSCAD" on Apple and
          # "openscad" elsewhere, and -perm -u+x rather than -perm +111,
          # which is BSD-only and a hard error in GNU find.
          BIN=$(find build/engine -maxdepth 3 -type f -iname 'openscad*' -perm -u+x | head -1)
          test -n "$BIN" || {
            echo "::error::no engine binary under build/engine"
            find build/engine -maxdepth 3 -name 'openscad*' | sed 's/^/found: /' || true
            exit 1
          }
          echo "path=$PWD/$BIN" >> "$GITHUB_OUTPUT"
          "$BIN" --version

      - name: integration tests
        env:
          OPENSCAD_ENGINE: ${{ steps.engine.outputs.path }}
          OPENSCAD_ENGINE_SHA: ${{ github.sha }}
        run: npm run test:integration

      - name: the engine must be genuinely headless
        env:
          OPENSCAD_ENGINE: ${{ steps.engine.outputs.path }}
        run: |
          # A GUI build would need a display; this must pass with none.
          env -u DISPLAY node dist/cli.js doctor
          # PNG is impossible under NULLGL: assert the CLI says so rather than
          # discovering it when a user asks for a preview.
          node dist/cli.js info | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const i=JSON.parse(s);
              if(i.capabilities.png!==false){console.error('expected png:false');process.exit(1);}
              if(!i.license.spdx.includes('GPL')){console.error('missing license');process.exit(1);}
              console.log('capabilities ok');
            });"
